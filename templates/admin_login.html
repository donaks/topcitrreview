{% extends 'admin_base.html' %}
{% block content %}
<div class="card narrow"><div class="card-body">
<h1 class="h3">Administrator sign-in</h1>
<form method="post">
  <input type="hidden" name="_csrf" value="{{csrf}}">
  <label>Email<input class="form-control mb-3" name="email" type="email" autocomplete="username" required></label>
  <label>Password<input class="form-control mb-3" name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn btn-primary">Sign in to administration</button>
</form>
<a href="{{url_for('login')}}">Student sign-in</a>
</div></div>
{% endblock %}
