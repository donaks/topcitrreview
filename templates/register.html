{% extends 'base.html' %}{% block content %}<div class="card narrow"><div class="card-body"><h2>Student registration</h2><form method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><label>Full name<input class="form-control mb-3" name="name" required></label><label>Email<input class="form-control mb-3" name="email" type="email" required></label><label>Password (12+ characters)<input class="form-control mb-3" name="password" type="password" minlength="12" required></label><button class="btn btn-primary">Create account</button></form></div></div>{% endblock %}
