{% extends 'base.html' %}
{% block content %}
<div class="card narrow"><div class="card-body">
  <h2>Verify your email</h2>
  <p>Enter the six-digit code for {{ email }}. It expires in 10 minutes.</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <label>Verification code<input class="form-control mb-3" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
    <button class="btn btn-primary">Verify and sign in</button>
  </form>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <button class="btn btn-link" name="action" value="resend">Send another code</button>
  </form>
</div></div>
{% endblock %}
