<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Question bank administration | TOPCIT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
<header class="bg-dark text-white py-3"><div class="container d-flex align-items-center justify-content-between">
  <strong>TOPCIT · Administration</strong>
  {% if session.get('bank_admin') %}
  <form method="post" action="{{url_for('bank.logout')}}"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="btn btn-outline-light btn-sm">Sign out</button></form>
  {% endif %}
</div></header>
<main class="container py-4">
  {% for message in get_flashed_messages() %}<div role="status" class="alert alert-info">{{message}}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body></html>
